name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # The newest Xcode on the runner image can ship without a pre-installed
      # iOS simulator runtime (or any pre-created devices), in which case a
      # name-based destination like "iPhone 17" matches nothing. Install the
      # runtime only if missing, then start a supported device. Dependency
      # resolution intentionally overlaps the hosted runner's cold simulator
      # boot, which otherwise adds several minutes to the critical path.
      - name: Create and boot iOS simulator
        id: simulator
        run: |
          set -euo pipefail
          if [ "$(xcrun simctl list runtimes ios --json | jq '[.runtimes[] | select(.isAvailable)] | length')" -eq 0 ]; then
            sudo xcodebuild -downloadPlatform iOS
          fi
          RUNTIMES=$(xcrun simctl list runtimes ios --json)
          RUNTIME=$(echo "$RUNTIMES" | jq -r '[.runtimes[] | select(.isAvailable)] | sort_by(.version) | last.identifier')
          DEVICE_TYPE=$(echo "$RUNTIMES" | jq -r '[.runtimes[] | select(.isAvailable)] | sort_by(.version) | last.supportedDeviceTypes | map(select(.productFamily=="iPhone")) | first.identifier')
          UDID=$(xcrun simctl create "CI iPhone" "$DEVICE_TYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          echo "Created $DEVICE_TYPE on $RUNTIME: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Resolve dependencies while simulator boots
        run: xcodebuild -project OrgSync.xcodeproj -scheme OrgSync-CI -resolvePackageDependencies

      - name: Wait for iOS simulator
        run: xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

      - name: Run tests
        env:
          IOS_SIMULATOR_ID: ${{ steps.simulator.outputs.udid }}
          TEST_RESULT_BUNDLE_PATH: TestResults
        # OrgSync-CI contains only OrgSyncTests. The UI target is deliberately
        # absent, and the opt-in live GitHub test remains explicitly skipped.
        run: ./Scripts/test_ci.sh

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TestResults
          path: TestResults.xcresult

  archive:
    name: Archive Validation
    runs-on: macos-26
    timeout-minutes: 20
    env:
      # The public SDK key is required by the Release build phase. Production
      # archives use the repository secret in the publish job below.
      REVENUECAT_API_KEY_LIVE: ci_archive_validation

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Build unsigned archive
        run: ./Scripts/archive_ci.sh

  publish:
    name: Archive and upload to TestFlight
    needs: [test, archive]
    # Pull requests validate tests and an unsigned archive. Deployment is
    # permitted only after both pass for a push to main.
    if: needs.test.result == 'success' && needs.archive.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_BYPASS_KEYCHAIN: "1"
      ASC_NO_UPDATE: "1"
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
      ASC_TESTFLIGHT_GROUP: ${{ vars.ASC_TESTFLIGHT_GROUP }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      REVENUECAT_API_KEY_LIVE: ${{ secrets.REVENUECAT_API_KEY_LIVE }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Check release configuration
        run: |
          set -euo pipefail
          required_values=(
            ASC_KEY_ID
            ASC_ISSUER_ID
            ASC_PRIVATE_KEY_B64
            ASC_TESTFLIGHT_GROUP
            BUILD_CERTIFICATE_BASE64
            P12_PASSWORD
            BUILD_PROVISION_PROFILE_BASE64
            WIDGET_PROVISION_PROFILE_BASE64
            KEYCHAIN_PASSWORD
            REVENUECAT_API_KEY_LIVE
          )
          missing_values=()
          for value_name in "${required_values[@]}"; do
            if [[ -z "${!value_name}" ]]; then
              missing_values+=("$value_name")
            fi
          done
          if (( ${#missing_values[@]} > 0 )); then
            echo "::error::Missing required release configuration: ${missing_values[*]}"
            exit 1
          fi

      - name: Setup App Store Connect CLI
        uses: rudrankriyam/setup-asc@5358c70a27a3f0d1517604b0f1fdc43e70c1cc4d # v1.0.1

      - name: Install signing certificate and provisioning profiles
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          install_profile() {
            local encoded_profile="$1"
            local profile_name="$2"
            local profile_path="$RUNNER_TEMP/$profile_name.mobileprovision"
            local profile_plist="$RUNNER_TEMP/$profile_name.plist"
            echo "$encoded_profile" | base64 -D > "$profile_path"
            security cms -D -i "$profile_path" > "$profile_plist"
            local profile_uuid
            profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$profile_plist")
            cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          }
          install_profile "$BUILD_PROVISION_PROFILE_BASE64" app
          install_profile "$WIDGET_PROVISION_PROFILE_BASE64" widget

      - name: Validate App Store Connect credentials
        run: asc auth status --validate

      - name: Publish to TestFlight
        run: |
          # GitHub run numbers are unique but begin at 1. The offset avoids
          # collisions with builds created before this workflow existed.
          export CI_BUILD_NUMBER="$((1000000 + GITHUB_RUN_NUMBER))"
          ./Scripts/publish_testflight.sh
