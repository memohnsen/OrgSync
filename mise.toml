[tools]
ruby = "3.3"

[tasks.build]
description = "Compile OrgSync for the configured iOS Simulator"
run = '''
xcodebuild \
  -project OrgSync.xcodeproj \
  -scheme OrgSync \
  -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID:-E4A6738D-A7CA-4CF9-A37F-2BB9839A4AF5}" \
  build
'''

[tasks.run]
description = "Build, install, and launch OrgSync in the configured iOS Simulator"
depends = ["build"]
run = '''
set -euo pipefail
simulator="${IOS_SIMULATOR_ID:-E4A6738D-A7CA-4CF9-A37F-2BB9839A4AF5}"
xcrun simctl boot "$simulator" 2>/dev/null || true
xcrun simctl bootstatus "$simulator" -b
app_path="$(xcodebuild -project OrgSync.xcodeproj -scheme OrgSync -destination "platform=iOS Simulator,id=$simulator" -showBuildSettings | awk -F ' = ' '/TARGET_BUILD_DIR/ {dir=$2} /WRAPPER_NAME/ {name=$2} END {print dir "/" name}')"
xcrun simctl install "$simulator" "$app_path"
xcrun simctl launch "$simulator" com.memohnsen.OrgSync
'''

[tasks.test]
description = "Run the complete unit and UI test suite"
run = '''
xcodebuild \
  -project OrgSync.xcodeproj \
  -scheme OrgSync \
  -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID:-E4A6738D-A7CA-4CF9-A37F-2BB9839A4AF5}" \
  test
'''

[tasks.test-ci]
description = "Run the deterministic unit suite used by CI"
run = '''
xcodebuild \
  -project OrgSync.xcodeproj \
  -scheme OrgSync \
  -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID:?IOS_SIMULATOR_ID is required}" \
  -skip-testing:OrgSyncUITests \
  -skip-testing:OrgSyncTests/LiveGitHubIntegrationTests \
  -resultBundlePath "${TEST_RESULT_BUNDLE_PATH:-TestResults}" \
  test
'''

[tasks.test-live-git]
description = "Run the opt-in read-only GitHub integration test"
run = '''
set -euo pipefail
marker=.orgsync-live-git-enabled
trap 'rm -f "$marker"' EXIT
touch "$marker"
xcodebuild \
  -project OrgSync.xcodeproj \
  -scheme OrgSync \
  -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID:-E4A6738D-A7CA-4CF9-A37F-2BB9839A4AF5}" \
  -only-testing:OrgSyncTests/LiveGitHubIntegrationTests \
  test
'''

[tasks.publish]
description = "Archive and upload OrgSync to App Store Connect"
run = '''
set -euo pipefail
asc xcode archive \
  --project OrgSync.xcodeproj \
  --scheme OrgSync \
  --archive-path .asc/artifacts/OrgSync.xcarchive \
  --clean --overwrite
asc xcode export \
  --archive-path .asc/artifacts/OrgSync.xcarchive \
  --ipa-path .asc/artifacts/OrgSync.ipa \
  --overwrite
asc publish appstore \
  --app 6792388512 \
  --ipa .asc/artifacts/OrgSync.ipa \
  --wait
'''
